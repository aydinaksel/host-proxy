[package]
name = "host-proxy"
version = "0.5.0"
edition = "2021"
description = "A Pingora reverse proxy that routes by hostname, with per-SNI certificates, private and bearer-token routes, and zero-downtime reloads"
license = "MIT"
repository = "https://github.com/aydinaksel/host-proxy"

[[bin]]
name = "host-proxy"
path = "src/main.rs"

[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Don't panic
unwrap_used = "deny"
expect_used = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
unchecked_time_subtraction = "deny"
exit = "deny"
as_conversions = "deny"

# Don't fail silently
let_underscore_future = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"

# Don't hold locks across await points
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
if_let_mutex = "deny"
large_futures = "deny"

# Don't mishandle memory
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_doc = "deny"
unnecessary_safety_comment = "deny"

# Don't compare or cast numbers carelessly
float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
cast_sign_loss = "deny"
invalid_upcast_comparisons = "deny"

# Easy wins
rc_mutex = "deny"
debug_assert_with_mut_call = "deny"
iter_not_returning_iterator = "deny"
expl_impl_clone_on_copy = "deny"
infallible_try_from = "deny"
dbg_macro = "deny"

# Suppressions must carry a reason
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[dependencies]
pingora = { version = "0.9", features = ["openssl", "proxy"] }
pingora-limits = "0.9"
pingora-prometheus = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
async-trait = "0.1"
http = "1"
tokio = { version = "1", features = ["signal"] }
