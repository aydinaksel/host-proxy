[package]
name = "host-proxy"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "host-proxy"
path = "src/main.rs"

[dependencies]
pingora = { version = "0.8", features = ["openssl", "proxy"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
async-trait = "0.1"
